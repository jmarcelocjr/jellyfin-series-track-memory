name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test

      - name: Package
        run: |
          # Tag v0.1.0.0-alpha -> plugin version 0.1.0.0, GitHub pre-release.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${TAG_VERSION%%-*}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3.4 or v1.2.3.4-alpha" >&2
            exit 1
          fi
          PRERELEASE=""
          if [[ "$TAG_VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          scripts/package.sh "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "artifacts/series-track-memory_${VERSION}.zip" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for $GITHUB_REF_NAME"
          git push origin main
