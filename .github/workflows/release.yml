name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package.sh "$VERSION" "$GITHUB_REPOSITORY"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "artifacts/series-track-memory_${VERSION}.zip" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for $GITHUB_REF_NAME"
          git push origin main
